name: Create upload keystore (one time)

# Run this ONCE, manually, from the Actions tab. It generates the Android
# "upload key" used to sign every release. Download the artifact it produces,
# store the .jks file somewhere you will still have in five years, then add the
# four repository secrets listed in the run summary. Delete the artifact after.
#
# With Play App Signing (enabled by default for new apps) Google holds the real
# app signing key; this upload key can be reset by Google if it is ever lost —
# but you still must not lose it casually.

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Key alias'
        default: 'upload'
      dname:
        description: 'Certificate name (CN=...)'
        default: 'CN=Split Expense, O=Split Expense, C=IN'
      validity_days:
        description: 'Validity in days'
        default: '10000'

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate keystore
        run: |
          STORE_PW=$(openssl rand -base64 24 | tr -d '/+=' | head -c 28)
          KEY_PW=$(openssl rand -base64 24 | tr -d '/+=' | head -c 28)
          keytool -genkeypair -v \
            -keystore upload-keystore.jks \
            -alias "${{ inputs.alias }}" \
            -keyalg RSA -keysize 2048 -validity "${{ inputs.validity_days }}" \
            -storepass "$STORE_PW" -keypass "$KEY_PW" \
            -dname "${{ inputs.dname }}"
          base64 -w0 upload-keystore.jks > upload-keystore.jks.base64
          {
            echo "## Upload keystore created"
            echo ""
            echo "1. Download the **upload-keystore** artifact below and keep \`upload-keystore.jks\` safe forever."
            echo "2. Add these four repository secrets (Settings → Secrets and variables → Actions):"
            echo ""
            echo "| Secret | Value |"
            echo "|---|---|"
            echo "| \`ANDROID_KEYSTORE_BASE64\` | contents of \`upload-keystore.jks.base64\` |"
            echo "| \`ANDROID_KEYSTORE_PASSWORD\` | \`$STORE_PW\` |"
            echo "| \`ANDROID_KEY_ALIAS\` | \`${{ inputs.alias }}\` |"
            echo "| \`ANDROID_KEY_PASSWORD\` | \`$KEY_PW\` |"
            echo ""
            echo "3. Delete this workflow run afterwards so the passwords don't linger in logs."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: upload-keystore
          path: |
            upload-keystore.jks
            upload-keystore.jks.base64
          retention-days: 1
