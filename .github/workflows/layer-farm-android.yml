# Builds the Android app in the cloud, so nobody needs Android Studio locally.
#
# Every push produces an installable debug APK as a run artifact. A signed
# release bundle for Play is built only on request, and only when the four
# keystore secrets exist — a fork, or a pull request from one, produces the
# debug APK and stops there.

# Runs the Layer Farm MIS build from its subdirectory, because GitHub only
# reads workflows from the repository root. When the project is lifted into
# its own repository this file goes away and layer-farm-mis/.github/workflows
# takes over unchanged.
name: Layer Farm MIS — Android build

on:
  push:
    # Feature branches build too, so an APK can be installed and tried before
    # anything is merged.
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Also build a signed release AAB for Play'
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: layer-farm-mis
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: layer-farm-mis/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          # The action's default package list still asks for the obsolete
          # `tools` package, which Google removed from the SDK repository —
          # sdkmanager exits 1 with "Failed to find package 'tools'" and the
          # whole job dies before installing anything. The runner image
          # already ships the SDK, so the explicit install below is all that
          # is needed.
          packages: ''

      - name: Install the SDK platform this project compiles against
        run: sdkmanager --install "platforms;android-36" "platform-tools"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build web bundle
        run: npm run build
        env:
          # Absent on a fork, which is fine: the app is local-first and runs
          # perfectly well with no cloud configured at all.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: Capacitor sync
        run: npx cap sync android

      - name: Build debug APK
        working-directory: layer-farm-mis/android
        run: ./gradlew assembleDebug --no-daemon -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: layer-farm-mis-debug-apk
          path: layer-farm-mis/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Decode release keystore
        id: keystore
        if: ${{ inputs.release && env.HAS_KEYSTORE == 'true' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          echo "path=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_OUTPUT"

      - name: Build release AAB
        if: ${{ inputs.release && env.HAS_KEYSTORE == 'true' }}
        working-directory: layer-farm-mis/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}

      - name: Upload release AAB
        if: ${{ inputs.release && env.HAS_KEYSTORE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: layer-farm-mis-release-aab
          path: layer-farm-mis/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
